name: Build Android GPU Variant APKs

# Manual trigger only: builds the M2 Stage C GPU A/B APK variants.
# The default CPU APK is built by android.yml, which stays untouched.
on:
  workflow_dispatch:
    inputs:
      build_skin:
        description: "GPU Skin APK: JFA_GPU_SKIN=1, JFA_GPU_RENDER=0 (GPU preparation only, CPU path renders)"
        type: boolean
        default: true
      build_render:
        description: "GPU Render APK: JFA_GPU_SKIN=1, JFA_GPU_RENDER=1 (GPU path renders, CPU fallback)"
        type: boolean
        default: true

jobs:
  # Each variant builds in its own job on a fresh runner, with its own
  # checkout and clean Gradle state, so the two builds can never share
  # or overwrite each other's outputs. The APK filenames themselves
  # are also distinct (renamed by app/build.gradle via -P properties).
  gpuSkin:
    name: GPU Skin APK (JFA_GPU_SKIN=1, JFA_GPU_RENDER=0)
    runs-on: ubuntu-latest
    if: ${{ inputs.build_skin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build GPU Skin APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug -PJFA_GPU_SKIN=1 -PJFA_GPU_RENDER=0

      - name: Upload GPU Skin APK
        uses: actions/upload-artifact@v4
        with:
          name: JoJo-Fighter-Android-gpuSkin
          path: Android/app/build/outputs/apk/debug/JoJo-Fighter-gpuSkin-debug.apk
          if-no-files-found: error

  gpuRender:
    name: GPU Render APK (JFA_GPU_SKIN=1, JFA_GPU_RENDER=1)
    runs-on: ubuntu-latest
    if: ${{ inputs.build_render }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build GPU Render APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug -PJFA_GPU_SKIN=1 -PJFA_GPU_RENDER=1

      - name: Upload GPU Render APK
        uses: actions/upload-artifact@v4
        with:
          name: JoJo-Fighter-Android-gpuRender
          path: Android/app/build/outputs/apk/debug/JoJo-Fighter-gpuRender-debug.apk
          if-no-files-found: error
